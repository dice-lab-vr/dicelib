name: Publish on PyPI
run-name: Publish on PyPI - ${{ github.sha }}
on:
  release:
    types: [published]
jobs:
  publish_on_pypi:
    name: Publish on PyPI
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dmri-dicelib
    permissions:
      actions: read
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Find wheel build for release commit
        id: wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build_wheels.yml/runs?event=push&status=success&head_sha=${GITHUB_SHA}&per_page=100" \
            | jq -r 'map(.workflow_runs[]) | sort_by(.created_at) | last | .id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful wheel build found for release commit $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.wheels.outputs.run_id }}
          path: dist
          merge-multiple: true

      - name: Check distribution artifacts
        run: |
          test -n "$(find dist -name '*.whl' -print -quit)" || {
            echo "::error::No wheels found"
            exit 1
          }
          test -n "$(find dist -name '*.tar.gz' -print -quit)" || {
            echo "::error::No source distribution found"
            exit 1
          }

      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
          print-hash: true

  publish_on_pypi_test:
    name: Publish on PyPI Test
    if: github.event.release.prerelease == true && contains(github.event.release.tag_name, 'rc')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dmri-dicelib
    permissions:
      actions: read
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Find wheel build for release commit
        id: wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build_wheels.yml/runs?event=push&status=success&head_sha=${GITHUB_SHA}&per_page=100" \
            | jq -r 'map(.workflow_runs[]) | sort_by(.created_at) | last | .id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful wheel build found for release commit $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.wheels.outputs.run_id }}
          path: dist
          merge-multiple: true

      - name: Check distribution artifacts
        run: |
          test -n "$(find dist -name '*.whl' -print -quit)" || {
            echo "::error::No wheels found"
            exit 1
          }
          test -n "$(find dist -name '*.tar.gz' -print -quit)" || {
            echo "::error::No source distribution found"
            exit 1
          }

      - name: Publish on PyPI Test
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
          print-hash: true
